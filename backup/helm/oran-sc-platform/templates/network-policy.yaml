{{- if .Values.networking.networkPolicies.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oran-sc-platform.fullname" . }}-default-deny
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networking.networkPolicies.defaultDeny }}
  # Default deny all traffic
  {{- else }}
  ingress: []
  egress: []
  {{- end }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oran-sc-platform.fullname" . }}-e2-interface
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: e2term
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow E2 SCTP traffic from external E2 nodes
    - from: []
      ports:
        - protocol: SCTP
          port: {{ .Values.e2term.service.ports.sctp }}
    # Allow RMR traffic from internal components
    - from:
        - podSelector:
            matchLabels:
              platform: {{ .Values.global.labels.platform }}
      ports:
        - protocol: TCP
          port: {{ .Values.global.rmr.data_port }}
        - protocol: TCP
          port: {{ .Values.global.rmr.port }}
  egress:
    # Allow RMR traffic to internal components
    - to:
        - podSelector:
            matchLabels:
              platform: {{ .Values.global.labels.platform }}
      ports:
        - protocol: TCP
          port: {{ .Values.global.rmr.data_port }}
        - protocol: TCP
          port: {{ .Values.global.rmr.port }}
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oran-sc-platform.fullname" . }}-a1-interface
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: a1mediator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow A1 REST API traffic from external SMO
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.a1mediator.service.ports.http }}
    # Allow RMR traffic from internal components
    - from:
        - podSelector:
            matchLabels:
              platform: {{ .Values.global.labels.platform }}
      ports:
        - protocol: TCP
          port: {{ .Values.global.rmr.data_port }}
        - protocol: TCP
          port: {{ .Values.global.rmr.port }}
  egress:
    # Allow RMR traffic to internal components
    - to:
        - podSelector:
            matchLabels:
              platform: {{ .Values.global.labels.platform }}
      ports:
        - protocol: TCP
          port: {{ .Values.global.rmr.data_port }}
        - protocol: TCP
          port: {{ .Values.global.rmr.port }}
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oran-sc-platform.fullname" . }}-o1-interface
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: o1mediator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow NETCONF traffic from external NMS
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.o1mediator.service.ports.netconf_ssh }}
        - protocol: TCP
          port: {{ .Values.o1mediator.service.ports.netconf_tls }}
        - protocol: TCP
          port: {{ .Values.o1mediator.service.ports.http }}
  egress:
    # Allow communication with platform components
    - to:
        - podSelector:
            matchLabels:
              platform: {{ .Values.global.labels.platform }}
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oran-sc-platform.fullname" . }}-internal-communication
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      platform: {{ .Values.global.labels.platform }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow internal platform communication
    - from:
        - podSelector:
            matchLabels:
              platform: {{ .Values.global.labels.platform }}
    # Allow monitoring traffic
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.monitoring.prometheus.port }}
  egress:
    # Allow internal platform communication
    - to:
        - podSelector:
            matchLabels:
              platform: {{ .Values.global.labels.platform }}
    # Allow database access
    - to:
        - podSelector:
            matchLabels:
              app: dbaas
      ports:
        - protocol: TCP
          port: {{ .Values.dbaas.service.ports.redis }}
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # Allow external monitoring endpoints
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

{{- end }}