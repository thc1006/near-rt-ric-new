apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-websocket-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-websocket
  template:
    metadata:
      labels:
        app: metrics-websocket
    spec:
      containers:
      - name: websocket-proxy
        image: prometheus/prometheus-websocket-proxy:v0.1.0
        ports:
        - containerPort: 8080
        env:
        - name: PROMETHEUS_URL
          value: http://prometheus-server
        - name: METRICS_BUFFER_SIZE
          value: "1000"
        - name: MAX_CONNECTIONS
          value: "100"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-websocket-service
spec:
  selector:
    app: metrics-websocket
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP