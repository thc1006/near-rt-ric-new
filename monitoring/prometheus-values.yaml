prometheus:
  prometheusSpec:
    # Extended retention for comprehensive analysis
    retention: 45d
    # Increased resource allocation for O-RAN telemetry
    resources:
      requests:
        memory: 4Gi
        cpu: 2
      limits:
        memory: 8Gi
        cpu: 4
    
    # Service discovery for O-RAN components
    serviceMonitorSelector:
      matchLabels:
        oran-monitoring: enabled
    
    # Additional scrape configurations
    additionalScrapeConfigs:
      - job_name: 'oran-e2'
        metrics_path: '/metrics'
        static_configs:
          - targets: 
            - 'near-rt-ric-e2:9090'
      - job_name: 'oran-a1'
        metrics_path: '/metrics'
        static_configs:
          - targets: 
            - 'near-rt-ric-a1:9090'
      - job_name: 'oran-o1'
        metrics_path: '/metrics'
        static_configs:
          - targets: 
            - 'near-rt-ric-o1:9090'

    # Storage configuration for long-term metrics
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

grafana:
  # Authentication and security
  adminPassword: "O-RAN_Monitoring2025!"
  
  # Resources for dashboard rendering
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  
  # Persistent dashboard storage
  persistence:
    enabled: true
    size: 10Gi
  
  # Additional data sources
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
      isDefault: false
    
    - name: Jaeger
      type: jaeger
      url: http://jaeger-query.monitoring.svc:16686
      access: proxy

  # Sidecar for automatic dashboard loading
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

  # Plugins for enhanced visualization
  plugins:
    - grafana-piechart-panel
    - grafana-worldmap-panel
    - grafana-clock-panel

# Prometheus Operator configurations
prometheusOperator:
  # Increased resources for complex service discovery
  resources:
    requests:
      cpu: 200m
      memory: 400Mi
    limits:
      cpu: 1
      memory: 1Gi