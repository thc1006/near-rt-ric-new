apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-stack
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-stack
  template:
    metadata:
      labels:
        app: monitoring-stack
        monitoring.oran.io/scrape: "true"
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      - name: grafana
        image: grafana/grafana:9.5.3
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-ui
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: monitoring-stack
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30003
  - port: 9090
    targetPort: 9090
    nodePort: 30090
