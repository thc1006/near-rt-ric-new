apiVersion: v1
kind: Service
metadata:
  name: du-service
  namespace: oran-network-functions
  labels:
    app: du
    component: distributed-unit
spec:
  selector:
    app: du
  ports:
  - name: f1-c
    port: 38472
    targetPort: 38472
    protocol: SCTP
  - name: f1-u
    port: 2152
    targetPort: 2152
    protocol: UDP
  - name: e2
    port: 36421
    targetPort: 36421
    protocol: SCTP
  - name: ecpri
    port: 4043
    targetPort: 4043
    protocol: UDP
  - name: metrics
    port: 9092
    targetPort: 9092
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: du-config
  namespace: oran-network-functions
data:
  cu.cp.address: "cu-cp-service.oran-network-functions.svc.cluster.local"
  e2term.address: "e2term-service.oran-system.svc.cluster.local"
  du.conf: |
    Active_gNBs = ( "du-01" );
    gNBs = (
      {
        gNB_ID = 1;
        gNB_name = "DU-01";
        
        # DU Configuration
        gNB_DU_ID = 1;
        enable_cu_cp = "no";
        enable_cu_up = "no";
        enable_du = "yes";
        
        # Cell Configuration
        nr_cellid = 1;
        physical_cellId = 0;
        tac = 1;
        
        # Carrier Configuration
        dl_carrierBandwidth = 106;  # 20 MHz
        ul_carrierBandwidth = 106;  # 20 MHz
        dl_frequencyBand = 78;      # n78
        ul_frequencyBand = 78;      # n78
        dl_absoluteFrequencySSB = 633280;  # 3.5 GHz
        dl_absoluteFrequencyPointA = 632628;
        ul_absoluteFrequencyPointA = 632628;
        
        # F1 Interface Configuration
        f1_cu_cp_ipv4_address = "cu-cp-service.oran-network-functions.svc.cluster.local";
        f1_cu_cp_port = 38472;
        f1_du_ipv4_address = "0.0.0.0";
        f1_du_port = 38472;
        
        # E2 Interface Configuration
        e2_agent = {
          near_ric_ip_addr = "e2term-service.oran-system.svc.cluster.local";
          sm_dir = "/usr/local/lib/flexric/";
        };
        
        # TDD Configuration
        tdd_config = {
          dl_ul_periodicity = "ms2p5";
          nrofDownlinkSlots = 7;
          nrofDownlinkSymbols = 6;
          nrofUplinkSlots = 2;
          nrofUplinkSymbols = 4;
        };
        
        # BWP Configuration
        initialDLBWPk0 = 0;
        initialDLBWPlocationAndBandwidth = 14025;
        initialDLBWPsubcarrierSpacing = "kHz30";
        initialDLBWPmappingType = 0;
        initialDLBWPk2 = 0;
        
        # PRACH Configuration
        prach_configuration = {
          prach_sequence_length = "L839";
          prach_sub_c_spacing = "kHz30";
          prach_config_common = {
            prach_config_index = 159;
            prach_msg1_fdm = "one";
            prach_msg1_frequency_start = 0;
            zero_correlation_zone_config = 13;
            preamble_received_target_power = -104;
            preamble_trans_max = 10;
            power_ramping_step = "dB2";
            ra_response_window = "sf20";
            ssb_per_rach_occasion_and_cb_preambles_per_ssb = "one";
          };
        };
        
        # PDSCH Configuration
        pdsch_time_domain_allocation = (
          {k0=0; mapping_type="typeA"; start_symbol=2; length=12;},
          {k0=0; mapping_type="typeA"; start_symbol=3; length=11;},
          {k0=1; mapping_type="typeA"; start_symbol=2; length=12;}
        );
        
        # PUSCH Configuration
        pusch_time_domain_allocation = (
          {k2=4; mapping_type="typeA"; start_symbol=2; length=12;},
          {k2=5; mapping_type="typeA"; start_symbol=2; length=12;},
          {k2=6; mapping_type="typeA"; start_symbol=2; length=12;}
        );
        
        # MAC Configuration
        mac_config = {
          ul_sch_scheduling = "dynamic";
          pusch_target_snrx10 = 200;
          pucch_target_snrx10 = 200;
          ulsch_max_frame_inactivity = 1;
        };
        
        # Physical Layer Configuration
        L1_CC = (
          {
            dl_antenna_ports = 1;
            ul_antenna_ports = 1;
            pdsch_antenna_ports = 1;
            pusch_antenna_ports = 1;
            pdcch_antenna_ports = 1;
            pucch_antenna_ports = 1;
          }
        );
      }
    );

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: du-sa
  namespace: oran-network-functions