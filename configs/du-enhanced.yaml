apiVersion: apps/v1
kind: Deployment
metadata:
  name: du-1
  namespace: oran-network-functions
  labels:
    app: du
    du-id: "1"
    component: distributed-unit
    interface: f1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: du
      du-id: "1"
  template:
    metadata:
      labels:
        app: du
        du-id: "1"
        component: distributed-unit
        interface: f1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "fronthaul-net",
            "interface": "fh0",
            "ips": ["10.10.1.1/24"]
          }]
    spec:
      serviceAccountName: du-sa
      containers:
      - name: du
        image: oaisoftwarealliance/oai-gnb:v2.0.0
        command: ["/opt/oai-gnb/bin/nr-softmodem"]
        args: ["-O", "/etc/oai/du.conf", "--sa", "--du"]
        resources:
          requests:
            cpu: 8
            memory: 16Gi
            hugepages-1Gi: 4Gi
            intel.com/intel_sriov_netdevice: "2"
          limits:
            cpu: 16
            memory: 32Gi
            hugepages-1Gi: 4Gi
            intel.com/intel_sriov_netdevice: "2"
        env:
        - name: DU_ID
          value: "1"
        - name: CELL_ID
          value: "1"
        - name: PHYSICAL_CELL_ID
          value: "0"
        - name: CU_IP
          valueFrom:
            configMapKeyRef:
              name: du-config
              key: cu.cp.address
        - name: E2_TERMINATION_IP
          valueFrom:
            configMapKeyRef:
              name: du-config
              key: e2term.address
        - name: TZ
          value: "UTC"
        ports:
        - containerPort: 38472  # F1-C interface
          name: f1-c
          protocol: SCTP
        - containerPort: 2152   # F1-U interface
          name: f1-u
          protocol: UDP
        - containerPort: 36421  # E2 interface
          name: e2
          protocol: SCTP
        - containerPort: 4043   # eCPRI
          name: ecpri
          protocol: UDP
        - containerPort: 9092   # Metrics
          name: metrics
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/oai
        - name: hugepage
          mountPath: /dev/hugepages
        - name: shared-data
          mountPath: /shared
        - name: radio-config
          mountPath: /radio
        livenessProbe:
          httpGet:
            path: /health
            port: 9092
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
        securityContext:
          capabilities:
            add: ["IPC_LOCK", "NET_ADMIN", "SYS_NICE", "SYS_ADMIN"]
          runAsUser: 0
      volumes:
      - name: config
        configMap:
          name: du-config
      - name: hugepage
        emptyDir:
          medium: HugePages
      - name: shared-data
        emptyDir: {}
      - name: radio-config
        configMap:
          name: radio-config
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/du
                operator: In
                values: ["true"]
      tolerations:
      - key: dedicated
        operator: Equal
        value: du
        effect: NoSchedule

---
