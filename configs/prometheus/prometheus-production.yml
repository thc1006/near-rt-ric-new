# Production Prometheus configuration for O-RAN Near-RT RIC
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'oran-near-rt-ric'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configuration
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # O-RAN Dashboard API
  - job_name: 'dashboard-api'
    static_configs:
      - targets: ['dashboard-api:9090']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # O-RAN RIC Core
  - job_name: 'ric-core'
    static_configs:
      - targets: ['ric-core:9091']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # xApp Manager
  - job_name: 'xapp-manager'
    static_configs:
      - targets: ['xapp-manager:9092']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Node Exporter (if available)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Docker metrics (if available)
  - job_name: 'docker'
    static_configs:
      - targets: ['docker-exporter:9323']
    scrape_interval: 30s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    scrape_interval: 30s

