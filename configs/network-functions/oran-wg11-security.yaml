# O-RAN WG11 Security Compliance Configuration
# Complete security implementation for O-RAN L Release with FIPS 140-3 enforcement

---
# WG11 E2 Interface Security Policy
apiVersion: security.o-ran.org/v1alpha1
kind: SecurityPolicy
metadata:
  name: e2-interface-security
  namespace: oran
  labels:
    interface: e2
    compliance: wg11
    security-level: high
spec:
  interface: e2
  mtls:
    enabled: true
    clientCertSecret: e2-client-cert-tls
    caCertSecret: e2-ca-cert-tls
    serverCertSecret: e2-server-cert-tls
    minTLSVersion: "1.3"
    cipherSuites:
      - TLS_AES_128_GCM_SHA256
      - TLS_AES_256_GCM_SHA384
      - TLS_CHACHA20_POLY1305_SHA256
    requireClientCert: true
    verifyPeerCertificate: true
  encryption:
    algorithm: AES-256-GCM
    keyRotation: 12h
    keyDerivation: PBKDF2
    saltLength: 32
  authentication:
    type: x509-certificate
    requireSigning: true
    allowedSigners:
      - "CN=O-RAN-SC-E2,O=O-RAN-SC,C=US"
    ocsp:
      enabled: true
      responderUrl: "http://ocsp.oran.local"
  integrity:
    hmac: SHA256
    signatureVerification: true
  audit:
    enabled: true
    logLevel: INFO
    auditEvents:
      - connection_established
      - connection_terminated
      - certificate_validation
      - encryption_key_rotation

---
# WG11 A1 Interface Security Policy
apiVersion: security.o-ran.org/v1alpha1
kind: SecurityPolicy
metadata:
  name: a1-interface-security
  namespace: nonrtric
  labels:
    interface: a1
    compliance: wg11
    security-level: high
spec:
  interface: a1
  authentication:
    type: oauth2
    issuerUrl: https://keycloak.oran.local/auth/realms/oran
    clientId: a1-policy-management
    clientSecret:
      secretName: a1-oauth-secret
      key: client-secret
    tokenValidation:
      jwksUrl: https://keycloak.oran.local/auth/realms/oran/protocol/openid-connect/certs
      audience: a1-interface
      issuer: https://keycloak.oran.local/auth/realms/oran
    scopes:
      - policy:read
      - policy:write
      - policy:delete
  authorization:
    type: rbac
    roles:
      - name: policy-admin
        permissions: ["create", "read", "update", "delete"]
        resources: ["policies", "policy-types", "services"]
      - name: policy-operator
        permissions: ["read", "update"]
        resources: ["policies", "services"]
      - name: policy-viewer
        permissions: ["read"]
        resources: ["policies", "policy-types", "services"]
  transport:
    tls:
      enabled: true
      minVersion: "1.3"
      clientCertSecret: a1-client-cert-tls
      serverCertSecret: a1-server-cert-tls
      caCertSecret: a1-ca-cert-tls
  rateLimit:
    enabled: true
    requestsPerMinute: 1000
    burstSize: 100
  audit:
    enabled: true
    logLevel: INFO
    auditEvents:
      - policy_creation
      - policy_modification
      - policy_deletion
      - unauthorized_access_attempt

---
# WG11 O1 Interface Security Policy
apiVersion: security.o-ran.org/v1alpha1
kind: SecurityPolicy
metadata:
  name: o1-interface-security
  namespace: oran
  labels:
    interface: o1
    compliance: wg11
    security-level: high
spec:
  interface: o1
  netconf:
    tls:
      enabled: true
      port: 6513
      clientCertSecret: o1-netconf-client-cert
      serverCertSecret: o1-netconf-server-cert
      caCertSecret: o1-netconf-ca-cert
      minTLSVersion: "1.3"
    ssh:
      enabled: true
      port: 830
      keyExchange: 
        - curve25519-sha256
        - diffie-hellman-group16-sha512
      encryption:
        - aes256-gcm@openssh.com
        - aes256-ctr
      mac:
        - hmac-sha2-256-etm@openssh.com
        - hmac-sha2-256
      hostKeySecret: o1-ssh-host-key
      authorizedKeysSecret: o1-ssh-authorized-keys
  accessControl:
    enabled: true
    nacp:
      enableNacp: true
      readDefault: deny
      writeDefault: deny
      execDefault: deny
      groups:
        - name: oran-admin
          users: ["admin", "oran-operator"]
        - name: oran-readonly
          users: ["monitor", "viewer"]
      rules:
        - name: admin-full-access
          groups: ["oran-admin"]
          moduleNames: ["*"]
          operations: ["*"]
          action: permit
        - name: readonly-access
          groups: ["oran-readonly"]
          moduleNames: ["ietf-interfaces", "o-ran-*"]
          operations: ["read"]
          action: permit
  audit:
    enabled: true
    logLevel: INFO
    auditEvents:
      - session_start
      - session_end
      - configuration_change
      - access_denied

---
# WG11 O2 Interface Security Policy
apiVersion: security.o-ran.org/v1alpha1
kind: SecurityPolicy
metadata:
  name: o2-interface-security
  namespace: ocloud-system
  labels:
    interface: o2
    compliance: wg11
    security-level: high
spec:
  interface: o2
  ocloud:
    authentication:
      type: oauth2
      tokenEndpoint: https://keycloak.oran.local/auth/realms/ocloud/protocol/openid-connect/token
      authorizationEndpoint: https://keycloak.oran.local/auth/realms/ocloud/protocol/openid-connect/auth
      clientId: o2-dms-client
      clientSecret:
        secretName: o2-oauth-secret
        key: client-secret
      scopes:
        - resource:read
        - resource:write
        - subscription:manage
    transport:
      mtls:
        enabled: true
        clientCertSecret: o2-client-cert-tls
        serverCertSecret: o2-server-cert-tls
        caCertSecret: o2-ca-cert-tls
        minTLSVersion: "1.3"
    resourcePool:
      security:
        isolation: true
        encryption: true
        keyManagement: vault
    subscription:
      authentication: required
      encryption: required
      signatureVerification: true
  audit:
    enabled: true
    logLevel: INFO
    auditEvents:
      - resource_discovery
      - subscription_created
      - subscription_deleted
      - resource_allocation
      - resource_deallocation

---
# FIPS 140-3 Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: fips-140-3-config
  namespace: oran
  labels:
    security-standard: fips-140-3
    go-version: "1.25"
data:
  fips-mode: "only"  # Go 1.25+ supports "only" mode for strict FIPS compliance
  openssl-config: |
    openssl_conf = openssl_init
    
    [openssl_init]
    providers = provider_sect
    
    [provider_sect]
    fips = fips_sect
    
    [fips_sect]
    activate = 1
    module_name = fips
  go-build-flags: |
    -tags=fips
    -ldflags=-X crypto/tls/fipsonly.fipsOnly=true
  environment-variables: |
    GODEBUG=fips140=only
    OPENSSL_FIPS=1
    GOFIPS=1
    CGO_ENABLED=1
    
---
# Pod Security Standards Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-security-standards
  namespace: oran
  labels:
    security-standard: pod-security-standards
data:
  security-context: |
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions:
      level: "s0:c123,c456"
  capabilities: |
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  volume-security: |
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    privileged: false

---
# Container Security Scanning Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: container-security-config
  namespace: oran
  labels:
    security-component: container-scanning
data:
  trivy-config: |
    format: json
    severity: HIGH,CRITICAL
    ignore-unfixed: false
    exit-code: 1
    timeout: 10m
    cache-dir: /tmp/.cache
    security-checks:
      - vuln
      - config
      - secret
  scan-policy: |
    # Vulnerability scan requirements
    max_critical: 0
    max_high: 5
    max_medium: 20
    
    # Configuration scan requirements
    dockerfile_best_practices: true
    kubernetes_security: true
    
    # Secret detection
    detect_secrets: true
    exclude_patterns:
      - "*.test"
      - "test_*"
  allowlist: |
    # Known false positives or accepted vulnerabilities
    cve_allowlist:
      - CVE-2023-XXXXX  # Example: accepted risk with mitigation
      
---
# Network Security Policies (Zero Trust)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zero-trust-default-deny
  namespace: oran
  labels:
    security-policy: zero-trust
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oran-e2-interface-policy
  namespace: oran
  labels:
    security-policy: zero-trust
    interface: e2
spec:
  podSelector:
    matchLabels:
      app: e2term
      interface: e2
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow E2 SCTP traffic with mTLS
    - from: []
      ports:
        - protocol: SCTP
          port: 36421
          endPort: 36421
    # Allow internal RMR communication
    - from:
        - podSelector:
            matchLabels:
              platform: oran-sc
      ports:
        - protocol: TCP
          port: 4560  # RMR data port
        - protocol: TCP
          port: 4561  # RMR route port
  egress:
    # Allow RMR to internal components
    - to:
        - podSelector:
            matchLabels:
              platform: oran-sc
      ports:
        - protocol: TCP
          port: 4560
        - protocol: TCP
          port: 4561
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # Allow certificate validation (OCSP)
    - to: []
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oran-a1-interface-policy
  namespace: nonrtric
  labels:
    security-policy: zero-trust
    interface: a1
spec:
  podSelector:
    matchLabels:
      app: policymanagementservice
      interface: a1
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow A1 HTTPS traffic
    - from: []
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8443
  egress:
    # Allow OAuth2 token validation
    - to: []
      ports:
        - protocol: TCP
          port: 443
      namespaceSelector:
        matchLabels:
          name: keycloak
    # Allow database access
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oran-o1-interface-policy
  namespace: oran
  labels:
    security-policy: zero-trust
    interface: o1
spec:
  podSelector:
    matchLabels:
      app: o1mediator
      interface: o1
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow NETCONF over SSH
    - from: []
      ports:
        - protocol: TCP
          port: 830
    # Allow NETCONF over TLS
    - from: []
      ports:
        - protocol: TCP
          port: 6513
    # Allow REST API
    - from: []
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
  egress:
    # Allow communication with platform components
    - to:
        - podSelector:
            matchLabels:
              platform: oran-sc
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53

---
# Service Mesh Security (Istio/Linkerd)
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: oran-mtls-strict
  namespace: oran
  labels:
    security-policy: service-mesh
spec:
  mtls:
    mode: STRICT

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: oran-authz-policy
  namespace: oran
  labels:
    security-policy: service-mesh
spec:
  rules:
    # E2 interface access
    - from:
        - source:
            principals: ["cluster.local/ns/oran/sa/e2term-sa"]
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/e2/*"]
      when:
        - key: source.certificate_fingerprint
          values: ["sha256:*"]  # Require client certificate
    
    # A1 interface access
    - from:
        - source:
            principals: ["cluster.local/ns/nonrtric/sa/policy-management-sa"]
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "DELETE"]
            paths: ["/a1-policy/*"]
      when:
        - key: request.auth.claims[scope]
          values: ["policy:read", "policy:write"]
    
    # O1 interface access
    - from:
        - source:
            principals: ["cluster.local/ns/oran/sa/o1mediator-sa"]
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/netconf/*", "/yang/*"]

---
# Security Secrets Templates
apiVersion: v1
kind: Secret
metadata:
  name: e2-ca-cert-tls
  namespace: oran
  labels:
    security-component: tls-certificates
    interface: e2
type: kubernetes.io/tls
stringData:
  # These would be populated with actual certificates in production
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    # E2 CA Certificate (placeholder)
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    # E2 CA Private Key (placeholder)
    -----END PRIVATE KEY-----

---
apiVersion: v1
kind: Secret
metadata:
  name: a1-oauth-secret
  namespace: nonrtric
  labels:
    security-component: oauth-credentials
    interface: a1
type: Opaque
stringData:
  client-secret: "placeholder-oauth-client-secret"
  
---
# Security Monitoring and Alerting
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-monitoring-rules
  namespace: oran
  labels:
    security-component: monitoring
data:
  prometheus-rules.yml: |
    groups:
      - name: oran-security-alerts
        rules:
          - alert: TLSCertificateExpiring
            expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
            for: 1h
            labels:
              severity: warning
              interface: "{{ $labels.interface }}"
            annotations:
              summary: "TLS certificate expiring in {{ $value }} days"
              
          - alert: FailedAuthentication
            expr: increase(oran_authentication_failures_total[5m]) > 10
            for: 2m
            labels:
              severity: critical
              interface: "{{ $labels.interface }}"
            annotations:
              summary: "High number of authentication failures detected"
              
          - alert: UnauthorizedAccess
            expr: increase(oran_unauthorized_access_total[5m]) > 0
            for: 1m
            labels:
              severity: critical
              interface: "{{ $labels.interface }}"
            annotations:
              summary: "Unauthorized access attempt detected"
              
          - alert: ContainerVulnerability
            expr: oran_container_vulnerabilities{severity="critical"} > 0
            for: 5m
            labels:
              severity: high
            annotations:
              summary: "Critical vulnerability detected in container {{ $labels.container }}"