global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'noreply@oran.local'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
    continue: true
  - match:
      service: dashboard-api
    receiver: 'dashboard-alerts'
  - match:
      service: ric
    receiver: 'ric-alerts'

receivers:
- name: 'default'
  webhook_configs:
  - url: 'http://dashboard-api:8080/api/v1/alerts'
    send_resolved: true

- name: 'critical-alerts'
  email_configs:
  - to: 'devops@oran.local'
    subject: 'CRITICAL: O-RAN Alert {{ .GroupLabels.alertname }}'
    body: |
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Details:
      {{ range .Labels.SortedPairs }} - {{ .Name }} = {{ .Value }}
      {{ end }}
      {{ end }}
  
- name: 'dashboard-alerts'
  webhook_configs:
  - url: 'http://dashboard-api:8080/api/v1/alerts/dashboard'
    send_resolved: true

- name: 'ric-alerts'
  webhook_configs:
  - url: 'http://ric:8081/api/v1/alerts'
    send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']