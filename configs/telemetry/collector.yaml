# O-RAN Telemetry Collector Configuration

server:
  host: "0.0.0.0"
  port: 8085
  metrics_port: 9094
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

kafka:
  brokers:
    - "kafka:29092"
  topics:
    measurement: "ves-measurement"
    fault: "ves-fault"
    notification: "ves-notification"
    registration: "ves-registration"
    other: "ves-other"
  producer:
    batch_size: 100
    batch_timeout: 10ms
    max_message_bytes: 1000000

influxdb:
  url: "http://influxdb:8086"
  token: "${INFLUXDB_TOKEN}"
  org: "oran"
  bucket: "oran-metrics"
  batch_size: 5000
  flush_interval: 1s

ves:
  endpoint: "/api/v1/ves"
  max_event_size: 10485760  # 10MB
  validate_schema: true
  enable_compression: true

processing:
  worker_count: 3
  buffer_size: 1000
  timeout: 30s

logging:
  level: "info"
  format: "json"
  output: "stdout"

metrics:
  enabled: true
  prefix: "oran_telemetry"
  
security:
  enable_tls: false
  cert_file: ""
  key_file: ""
  ca_file: ""