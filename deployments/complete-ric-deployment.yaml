                      font-size: 14px;
                  }
                  .badge {
                      display: inline-block;
                      padding: 3px 8px;
                      border-radius: 3px;
                      font-size: 11px;
                      font-weight: 600;
                  }
                  .badge-success {
                      background: #d1fae5;
                      color: #065f46;
                  }
                  .badge-warning {
                      background: #fed7aa;
                      color: #92400e;
                  }
                  .refresh-btn {
                      background: #667eea;
                      color: white;
                      border: none;
                      padding: 8px 20px;
                      border-radius: 5px;
                      cursor: pointer;
                      font-size: 14px;
                      font-weight: 600;
                  }
                  .refresh-btn:hover {
                      background: #5a67d8;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <div style="display: flex; justify-content: space-between; align-items: center;">
                          <div>
                              <h1>O-RAN Near-RT RIC Dashboard</h1>
                              <span class="status-badge status-operational">OPERATIONAL</span>
                              <span style="margin-left: 10px; color: #666;">L-Release</span>
                          </div>
                          <button class="refresh-btn" onclick="location.reload()">Refresh</button>
                      </div>
                  </div>
                  
                  <div class="grid">
                      <div class="card">
                          <h2>System Metrics</h2>
                          <div class="metric">
                              <span class="metric-label">Throughput</span>
                              <span class="metric-value">1.2 Gbps</span>
                          </div>
                          <div class="metric">
                              <span class="metric-label">Latency</span>
                              <span class="metric-value">8 ms</span>
                          </div>
                          <div class="metric">
