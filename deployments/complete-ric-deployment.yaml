                                  <div class="component-status">RUNNING</div>
                              </div>
                              <div class="component">
                                  <div class="component-name">Routing Mgr</div>
                                  <div class="component-status">RUNNING</div>
                              </div>
                              <div class="component">
                                  <div class="component-name">Database</div>
                                  <div class="component-status">RUNNING</div>
                              </div>
                          </div>
                      </div>
                  </div>
                  
                  <div class="card">
                      <h2>E2 Nodes</h2>
                      <table class="table">
                          <thead>
                              <tr>
                                  <th>ID</th>
                                  <th>Name</th>
                                  <th>Type</th>
                                  <th>Cells</th>
                                  <th>Status</th>
                              </tr>
                          </thead>
                          <tbody>
                              <tr>
                                  <td>gnb001</td>
                                  <td>gNodeB-001</td>
                                  <td>5G-NR</td>
                                  <td>3</td>
                                  <td><span class="badge badge-success">Connected</span></td>
                              </tr>
                              <tr>
                                  <td>gnb002</td>
                                  <td>gNodeB-002</td>
                                  <td>5G-NR</td>
                                  <td>2</td>
                                  <td><span class="badge badge-success">Connected</span></td>
                              </tr>
                              <tr>
                                  <td>enb001</td>
                                  <td>eNodeB-001</td>
                                  <td>4G-LTE</td>
                                  <td>1</td>
                                  <td><span class="badge badge-success">Connected</span></td>
                              </tr>
                          </tbody>
                      </table>
                  </div>
                  
                  <div class="grid">
                      <div class="card">
                          <h2>xApps</h2>
                          <table class="table">
                              <thead>
                                  <tr>
                                      <th>Name</th>
                                      <th>Version</th>
                                      <th>Instances</th>
                                      <th>Status</th>
                                  </tr>
                              </thead>
                              <tbody>
                                  <tr>
                                      <td>KPI Monitor</td>
                                      <td>1.0.0</td>
                                      <td>2</td>
                                      <td><span class="badge badge-success">Running</span></td>
                                  </tr>
                                  <tr>
                                      <td>QoE Predictor</td>
                                      <td>2.1.0</td>
                                      <td>1</td>
                                      <td><span class="badge badge-success">Running</span></td>
                                  </tr>
                                  <tr>
                                      <td>Traffic Steering</td>
                                      <td>1.5.0</td>
                                      <td>1</td>
                                      <td><span class="badge badge-success">Running</span></td>
                                  </tr>
                              </tbody>
                          </table>
                      </div>
                      
                      <div class="card">
                          <h2>Active Policies</h2>
                          <table class="table">
                              <thead>
                                  <tr>
                                      <th>ID</th>
                                      <th>Type</th>
                                      <th>Target</th>
                                      <th>Status</th>
                                  </tr>
                              </thead>
                              <tbody>
                                  <tr>
                                      <td>pol001</td>
                                      <td>QoS</td>
                                      <td>slice-001</td>
                                      <td><span class="badge badge-success">Active</span></td>
                                  </tr>
                                  <tr>
                                      <td>pol002</td>
                                      <td>Traffic</td>
                                      <td>cell-002</td>
                                      <td><span class="badge badge-success">Active</span></td>
                                  </tr>
                                  <tr>
                                      <td>pol003</td>
                                      <td>Power</td>
                                      <td>gnb001</td>
                                      <td><span class="badge badge-warning">Pending</span></td>
                                  </tr>
                              </tbody>
                          </table>
                      </div>
                  </div>
              </div>
              <script>
                  // Auto-refresh every 30 seconds
                  setTimeout(() => location.reload(), 30000);
                  
                  // Add timestamp
                  console.log('Dashboard loaded at:', new Date().toISOString());
              </script>
          </body>
          </html>
          `;
          
          const server = http.createServer((req, res) => {
            const parsedUrl = url.parse(req.url, true);
            
            if (parsedUrl.pathname === '/' || parsedUrl.pathname === '/dashboard') {
              res.writeHead(200, { 'Content-Type': 'text/html' });
              res.end(htmlContent);
            } else if (parsedUrl.pathname === '/api/status') {
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify(ricData));
            } else if (parsedUrl.pathname === '/health') {
              res.writeHead(200, { 'Content-Type': 'text/plain' });
              res.end('OK');
            } else {
              res.writeHead(404, { 'Content-Type': 'text/plain' });
              res.end('Not Found');
            }
          });
          
          server.listen(PORT, () => {
            console.log(\`RIC Dashboard running on port \${PORT}\`);
          });
          EOF
          node server.js
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: ric-dashboard-api
  namespace: ricplt
spec:
  selector:
    app: ric-dashboard-api
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
# Ingress for Browser Access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ric-dashboard-ingress
  namespace: ricplt
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: ric-dashboard.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ric-dashboard-api
            port:
              number: 8080
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ric-dashboard-api
            port:
              number: 8080
---
# NodePort Service for Direct Browser Access
apiVersion: v1
kind: Service
metadata:
  name: ric-dashboard-nodeport
  namespace: ricplt
spec:
  type: NodePort
  selector:
    app: ric-dashboard-api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
---
# Sample xApp Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xapp-kpimon
  namespace: ricxapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xapp-kpimon
  template:
    metadata:
      labels:
        app: xapp-kpimon
    spec:
      containers:
      - name: kpimon
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-conf
        configMap:
          name: xapp-kpimon-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xapp-kpimon-config
  namespace: ricxapp
data:
  default.conf: |
    server {
        listen 8080;
        location / {
            return 200 '{"xapp": "KPI-Monitor", "version": "1.0.0", "status": "running", "metrics": {"throughput": "1.2Gbps", "latency": "8ms"}}';
            add_header Content-Type application/json;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: xapp-kpimon
  namespace: ricxapp
spec:
  selector:
    app: xapp-kpimon
  ports:
  - port: 8080
    targetPort: 8080