# A1 Mediator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ricplt-a1mediator
  namespace: ricplt
  labels:
    app: ricplt-a1mediator
    release: oran-sc-l-release
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ricplt-a1mediator
  template:
    metadata:
      labels:
        app: ricplt-a1mediator
        release: oran-sc-l-release
    spec:
      serviceAccountName: oran-sc-platform
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      containers:
      - name: a1mediator
        image: nexus3.o-ran-sc.org:10002/o-ran-sc/ric-plt-a1:2.10.4
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 10000
          name: http
        - containerPort: 38000
          name: rmr-data
        - containerPort: 38001
          name: rmr-route
        env:
        - name: RMR_RTG_SVC
          value: "4561"
        - name: RMR_SEED_RT
          value: "/opt/a1mediator/router.txt"
        - name: DBAAS_SERVICE_HOST
          value: "service-ricplt-dbaas-tcp"
        - name: DBAAS_SERVICE_PORT
          value: "6379"
        - name: LOG_LEVEL
          value: "INFO"
        - name: A1_RMR_RETRY_TIMES
          value: "4"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: config-volume
          mountPath: /opt/a1mediator/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /a1-p/healthcheck
            port: 10000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /a1-p/healthcheck
            port: 10000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: ric-platform-config
      - name: tmp
        emptyDir: {}
---
# Service for A1 Mediator
apiVersion: v1
kind: Service
metadata:
  name: service-ricplt-a1mediator-http
  namespace: ricplt
  labels:
    app: ricplt-a1mediator
spec:
  type: ClusterIP
  ports:
  - port: 10000
    targetPort: 10000
    protocol: TCP
    name: http
  - port: 38000
    targetPort: 38000
    protocol: TCP
    name: rmr-data
  selector:
    app: ricplt-a1mediator
---
# Service Monitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ric-platform-metrics
  namespace: ricplt
  labels:
    app: ric-platform
    release: oran-sc-l-release
spec:
  selector:
    matchLabels:
      app: ric-platform
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
# Network Policy for RIC Platform
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ric-platform-network-policy
  namespace: ricplt
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ricplt
    - namespaceSelector:
        matchLabels:
          name: ricxapp
    - namespaceSelector:
        matchLabels:
          name: monitoring
  - from: []
    ports:
    - protocol: SCTP
      port: 36421
    - protocol: SCTP  
      port: 36422
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: ricplt
    - namespaceSelector:
        matchLabels:
          name: ricxapp
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# Pod Disruption Budget for High Availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ric-platform-pdb
  namespace: ricplt
spec:
  minAvailable: 1
  selector:
    matchLabels:
      release: oran-sc-l-release