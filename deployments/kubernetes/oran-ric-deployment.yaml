apiVersion: v1
kind: Namespace
metadata:
  name: oran-ric
  labels:
    name: oran-ric
    app.kubernetes.io/name: oran-near-rt-ric
    app.kubernetes.io/instance: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oran-config
  namespace: oran-ric
data:
  database-url: "postgres://oran_prod:secure_password_123@postgres:5432/oran_prod?sslmode=require"
  redis-url: "redis://:secure_redis_123@redis:6379"
  log-level: "info"
  go-env: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: oran-secrets
  namespace: oran-ric
type: Opaque
stringData:
  db-password: "secure_password_123"
  redis-password: "secure_redis_123"
  jwt-secret: "your_jwt_secret_key_here_replace_in_production"
  grafana-password: "admin123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: oran-ric
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "oran_prod"
        - name: POSTGRES_USER
          value: "oran_prod"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oran-secrets
              key: db-password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - oran_prod
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - oran_prod
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: oran-ric
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: oran-ric
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --requirepass
        - $(REDIS_PASSWORD)
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oran-secrets
              key: redis-password
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: oran-ric
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: oran-ric
  labels:
    app: dashboard-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      containers:
      - name: dashboard-api
        image: oran/dashboard-api:v1.0.0
        ports:
        - containerPort: 8080
        - containerPort: 9090
        env:
        - name: GO_ENV
          value: "production"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: oran-config
              key: log-level
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "oran_prod"
        - name: DB_USER
          value: "oran_prod"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oran-secrets
              key: db-password
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oran-secrets
              key: redis-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: oran-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api
  namespace: oran-ric
spec:
  selector:
    app: dashboard-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ric-core
  namespace: oran-ric
  labels:
    app: ric-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ric-core
  template:
    metadata:
      labels:
        app: ric-core
    spec:
      containers:
      - name: ric-core
        image: oran/ric-core:v1.0.0
        ports:
        - containerPort: 36421
          protocol: SCTP
        - containerPort: 38412
        - containerPort: 38422
        - containerPort: 8081
        - containerPort: 9091
        env:
        - name: GO_ENV
          value: "production"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: oran-config
              key: log-level
        - name: E2_BIND_ADDR
          value: "0.0.0.0:36421"
        - name: S1_BIND_ADDR
          value: "0.0.0.0:38412"
        - name: X2_BIND_ADDR
          value: "0.0.0.0:38422"
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        livenessProbe:
          exec:
            command:
            - /ric
            - health
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ric-core
  namespace: oran-ric
spec:
  selector:
    app: ric-core
  ports:
  - name: e2
    port: 36421
    targetPort: 36421
    protocol: SCTP
  - name: s1
    port: 38412
    targetPort: 38412
  - name: x2
    port: 38422
    targetPort: 38422
  - name: http
    port: 8081
    targetPort: 8081
  - name: metrics
    port: 9091
    targetPort: 9091
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dashboard
  namespace: oran-ric
  labels:
    app: web-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-dashboard
  template:
    metadata:
      labels:
        app: web-dashboard
    spec:
      containers:
      - name: web-dashboard
        image: oran/web-dashboard:v1.0.0
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-dashboard
  namespace: oran-ric
spec:
  selector:
    app: web-dashboard
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oran-ric-ingress
  namespace: oran-ric
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: oran-ric.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-dashboard
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: dashboard-api
            port:
              number: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: oran-ric
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: oran-ric
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi