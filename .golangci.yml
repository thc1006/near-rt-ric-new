# golangci-lint configuration for O-RAN Near-RT RIC

run:
  timeout: 5m
  tests: true
  go: "1.21"  # Replaced global run.go setting in stylecheck

output:
  formats:
    - format: colored-line-number  # Updated from deprecated format
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
  fix: true
  exclude-files:  # Replaced deprecated run.skip-files
    - ".*\\.pb\\.go$"
    - ".*\\.pb\\.gw\\.go$"
    - ".*_test\\.go$"
  exclude-dirs:  # Replaced deprecated run.skip-dirs
    - vendor
    - ui
    - docs
    - scripts
    - helm
  exclude-use-default: false
  exclude:
    # Exclude common false positives
    - "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"
    - "exported (type|method|function) (.+) should have comment or be unexported"
    - "ST1000: at least one file in a package should have a package comment"

  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - mnd
        
    # Exclude generated files
    - path: \.pb\.go
      linters:
        - all
        
    # Exclude vendor
    - path: vendor/
      linters:
        - all
        
    # Exclude specific messages
    - text: "weak cryptographic primitive"
      linters:
        - gosec
        
    # Exclude long lines in comments
    - source: "^//go:generate "
      linters:
        - lll
        
    # Allow TODO comments
    - text: "TODO"
      linters:
        - godox

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    
    # Additional linters for better code quality
    - bodyclose
    - dogsled
    - dupl
    # - copyloopvar  # Requires Go 1.22+, disabled for Go 1.21
    - gci
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gofmt
    - goimports
    - mnd
    - goprintffuncname
    - gosec
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - stylecheck
    - unconvert
    - unparam
    - whitespace
    
  disable:
    - exhaustive
    - gochecknoglobals
    - gochecknoinits
    - godox
    - nlreturn
    - testpackage
    - wrapcheck
    - wsl

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    
  # Removed govet check-shadowing, replaced by shadow linter
  
  gocyclo:
    min-complexity: 15
    
  gocognit:
    min-complexity: 20
    
  goconst:
    min-len: 3
    min-occurrences: 3
    
  dupl:
    threshold: 100
    
  mnd:
    settings:
      mnd:
        checks:
          - argument
          - case
          - condition
          - operation
          - return
          - assign
        ignored-numbers:
          - '0'
          - '1'
          - '2'
          - '10'
          - '100'
          - '1000'
        ignored-functions:
          - 'time.Duration'
          
  lll:
    line-length: 120
    tab-width: 4
    
  misspell:
    locale: US
    
  nakedret:
    max-func-lines: 30
    
  prealloc:
    simple: true
    for-loops: true
    
  unparam:
    check-exported: true
    
  gosec:
    excludes:
      - G104  # Audit errors not checked
      - G204  # Audit use of command execution
    severity: medium
    confidence: medium
    
  goimports:
    local-prefixes: github.com/oran
    
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/oran)
      - blank
      - dot
    
  revive:
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id
      
  stylecheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    dot-import-whitelist:
      - github.com/onsi/ginkgo
      - github.com/onsi/gomega
    initialisms: ["ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS", "ORAN", "RIC", "RAN", "E2", "A1", "O1"]
    http-status-code-whitelist: []

severity:
  default-severity: warning
  case-sensitive: false
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - dupl
      severity: info