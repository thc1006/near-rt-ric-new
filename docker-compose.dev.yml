version: '3.8'

# Development overlay for docker-compose.yml
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # =============================================================================
  # Development Overrides for Core Services
  # =============================================================================
  
  dashboard-api:
    volumes:
      - .:/app/src:ro
      - ./configs:/configs
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=debug
      - HOT_RELOAD=true
      - GIN_MODE=debug
    command: >
      sh -c "
        if command -v air > /dev/null; then
          cd /app/src && air -c .air.toml
        else
          cd /app/src && go run -mod=readonly ./cmd/dashboard-api
        fi
      "
    ports:
      - "8080:8080"
      - "40000:40000"  # Delve debugger
    networks:
      - oran-network

  ric:
    volumes:
      - ./configs/ric:/configs
      - ./logs:/app/logs
      - ric-dev-data:/data
    environment:
      - LOG_LEVEL=debug
      - DEV_MODE=true
    networks:
      - oran-network

  xapp-hello-world:
    volumes:
      - ./configs/xapp:/configs
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=debug
      - DEV_MODE=true
    networks:
      - oran-network

  # =============================================================================
  # Development Tools & Services
  # =============================================================================

  # Code quality tools
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-dev
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar123
    volumes:
      - sonarqube-conf:/opt/sonarqube/conf
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
    depends_on:
      - postgres
    networks:
      - oran-network
    profiles:
      - dev
      - full

  # Message queue for async processing
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=oran
      - RABBITMQ_DEFAULT_PASS=oran123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - oran-network
    profiles:
      - dev
      - async

  # Load testing
  k6:
    image: loadimpact/k6:latest
    container_name: k6-dev
    volumes:
      - ./test/load:/scripts
    command: run /scripts/load-test.js
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    depends_on:
      - influxdb
      - dashboard-api
    networks:
      - oran-network
    profiles:
      - load-test

  # Time-series database for load testing metrics
  influxdb:
    image: influxdb:1.8-alpine
    container_name: influxdb-dev
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_ADMIN_ENABLED=true
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - oran-network
    profiles:
      - load-test

  # API documentation
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui-dev
    ports:
      - "8085:8080"
    environment:
      - SWAGGER_JSON=/specs/api.yaml
    volumes:
      - ./docs/api:/specs:ro
    networks:
      - oran-network
    profiles:
      - dev
      - docs

  # Development proxy for API testing
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/ssl:/etc/ssl:ro
    depends_on:
      - dashboard-api
      - ui-dev
    networks:
      - oran-network
    profiles:
      - dev
      - proxy

  # Enhanced UI development
  ui-dev:
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    container_name: ui-dev-enhanced
    ports:
      - "3001:3000"
      - "3002:3001"  # Storybook
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_WS_URL=ws://localhost:8080/ws
      - BROWSER=none
      - EXTEND_ESLINT=true
    volumes:
      - ./ui:/app
      - /app/node_modules
      - ./ui/storybook-static:/app/storybook-static
    networks:
      - oran-network
    profiles:
      - dev

  # Log aggregation for development
  fluentd:
    image: fluent/fluentd:v1.14-1
    container_name: fluentd-dev
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./configs/fluentd:/fluentd/etc
      - fluentd-logs:/fluentd/log
    networks:
      - oran-network
    profiles:
      - logging

  # Elasticsearch for log storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: elasticsearch-dev
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - cluster.name=oran-dev-cluster
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - oran-network
    profiles:
      - logging
      - elk

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: kibana-dev
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana-dev
      - SERVER_HOST=0.0.0.0
    depends_on:
      - elasticsearch
    networks:
      - oran-network
    profiles:
      - logging
      - elk

  # Development database with enhanced config
  postgres:
    environment:
      - POSTGRES_DB=oran
      - POSTGRES_USER=oran  
      - POSTGRES_PASSWORD=oran123
      - POSTGRES_MULTIPLE_DATABASES=oran_test,sonar
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./scripts/db/init-dev.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/db/test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql:ro
    ports:
      - "5432:5432"
    command: >
      postgres
        -c log_statement=all
        -c log_destination=stderr
        -c log_min_duration_statement=0
        -c max_connections=200
    networks:
      - oran-network

  # Enhanced Redis with modules
  redis:
    image: redis/redis-stack:latest
    container_name: redis-dev-stack
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec
    volumes:
      - redis-dev-data:/data
      - ./configs/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - oran-network

  # =============================================================================
  # Monitoring & Observability (Enhanced)
  # =============================================================================

  prometheus:
    volumes:
      - ./configs/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=30d'

  grafana:
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_FEATURE_TOGGLES_ENABLE=ngalert
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-dev-data:/var/lib/grafana

  # Alert manager for Prometheus
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-dev
    ports:
      - "9093:9093"
    volumes:
      - ./configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - oran-network
    profiles:
      - monitoring

  # Node exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-dev
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - oran-network
    profiles:
      - monitoring

# =============================================================================
# Development Volumes
# =============================================================================

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  grafana-dev-data:
    driver: local
  ric-dev-data:
    driver: local
  sonarqube-conf:
    driver: local
  sonarqube-data:
    driver: local
  sonarqube-logs:
    driver: local
  rabbitmq-data:
    driver: local
  influxdb-data:
    driver: local
  elasticsearch-data:
    driver: local
  fluentd-logs:
    driver: local
  alertmanager-data:
    driver: local

# =============================================================================
# Development Networks
# =============================================================================

networks:
  oran-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1