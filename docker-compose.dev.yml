version: '3.8'

# Development Environment Overrides
# Use with: docker-compose -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.dev.yml up

services:
  # =============================================================================
  # Development Overrides for Core Services
  # =============================================================================
  
  dashboard-api:
    volumes:
      - .:/app/src:ro
      - ./configs:/configs
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=debug
      - HOT_RELOAD=true
      - GIN_MODE=debug
    command: >
      sh -c "
        if command -v air > /dev/null; then
          cd /app/src && air -c .air.toml
        else
          cd /app/src && go run -mod=readonly ./cmd/dashboard-api
        fi
      "
    ports:
      - "8080:8080"
      - "40000:40000"  # Delve debugger

  ric:
    volumes:
      - ./configs/ric:/configs
      - ./logs:/app/logs
      - ric-dev-data:/data
    environment:
      - LOG_LEVEL=debug
      - DEV_MODE=true

  xapp-hello-world:
    volumes:
      - ./configs/xapp:/configs
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=debug
      - DEV_MODE=true

  # =============================================================================
  # Development-specific Services
  # =============================================================================

  # Database admin tool
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8083:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=pepa-linha
    depends_on:
      - postgres
    networks:
      - oran-network
    profiles:
      - dev

  # Redis admin tool
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8084:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - oran-network
    profiles:
      - dev

  # UI development server
  ui-dev:
    image: node:18-alpine
    container_name: ui-dev
    working_dir: /app
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_WS_URL=ws://localhost:8080/ws
    volumes:
      - ./ui:/app
      - /app/node_modules  # Anonymous volume for node_modules
    command: sh -c "npm install && npm start"
    networks:
      - oran-network
    profiles:
      - dev

  # Enhanced Postgres for development
  postgres:
    environment:
      - POSTGRES_DB=${DB_NAME:-oran}
      - POSTGRES_USER=${DB_USER:-oran}  
      - POSTGRES_PASSWORD=${DB_PASSWORD:-oran123}
      - POSTGRES_MULTIPLE_DATABASES=oran_test
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./scripts/db/init-dev.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/db/test-data.sql:/docker-entrypoint-initdb.d/02-test-data.sql:ro
    command: >
      postgres
        -c log_statement=all
        -c log_destination=stderr
        -c log_min_duration_statement=0
        -c max_connections=200

  # Enhanced Grafana for development
  grafana:
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_FEATURE_TOGGLES_ENABLE=ngalert
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-dev-data:/var/lib/grafana

  # Enhanced Prometheus for development
  prometheus:
    volumes:
      - ./configs/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=7d'

# =============================================================================
# Development Volumes
# =============================================================================

volumes:
  postgres-dev-data:
    driver: local
  grafana-dev-data:
    driver: local
  ric-dev-data:
    driver: local