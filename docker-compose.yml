version: '3.8'

# Base O-RAN Near-RT RIC Configuration
# This file contains only the core O-RAN services
# Use with infrastructure and environment-specific overlays

services:
  # =============================================================================
  # Core O-RAN Components
  # =============================================================================
  
  dashboard-api:
    build:
      context: .
      dockerfile: build/dashboard-api/Dockerfile
      args:
        - GO_VERSION=1.21
        - BUILD_VERSION=${VERSION:-dev}
    image: oran/dashboard-api:${VERSION:-latest}
    container_name: dashboard-api
    ports:
      - "8080:8080"
      - "9090:9090"  # Metrics
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-oran}
      - DB_USER=${DB_USER:-oran}
      - DB_PASSWORD=${DB_PASSWORD:-oran123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oran-network
    volumes:
      - ./configs:/configs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ric:
    build:
      context: .
      dockerfile: build/ric/Dockerfile
    image: oran/ric:${VERSION:-latest}
    container_name: ric
    ports:
      - "36421:36421"  # E2 SCTP
      - "8081:8081"     # HTTP API
      - "9091:9091"     # Metrics
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - E2_BIND_ADDR=0.0.0.0:36421
      - ENABLE_TLS=${ENABLE_TLS:-false}
    networks:
      - oran-network
    volumes:
      - ./configs/ric:/configs:ro
      - ric-data:/data
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  xapp-hello-world:
    build:
      context: .
      dockerfile: build/xapp-hello-world/Dockerfile
    image: oran/xapp-hello-world:${VERSION:-latest}
    container_name: xapp-hello-world
    ports:
      - "8082:8082"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RMR_SEED_RT=/configs/routes.txt
      - RIC_HOST=ric
      - RIC_PORT=8081
    depends_on:
      - ric
    networks:
      - oran-network
    volumes:
      - ./configs/xapp:/configs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

# =============================================================================
# Networks
# =============================================================================

networks:
  oran-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================

volumes:
  ric-data:
    driver: local