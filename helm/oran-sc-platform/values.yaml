# O-RAN SC Platform Foundation - Default Values
# This file contains default values for the O-RAN SC platform deployment

global:
  # Global configuration for all components
  namespace: ricplt
  repository: nexus3.o-ran-sc.org:10002/o-ran-sc
  pullPolicy: IfNotPresent
  
  # RMR Configuration
  rmr:
    port: 4560
    data_port: 4561
    
  # Common labels
  labels:
    platform: o-ran-sc
    release: oran-sc-platform

# Core Components Configuration
# These are the mandatory O-RAN SC components

# Database Service (Redis/SDL) - Required for state persistence
dbaas:
  enabled: true
  image:
    registry: nexus3.o-ran-sc.org:10002
    name: o-ran-sc/ric-plt-dbaas
    tag: 1.3.3
  service:
    type: ClusterIP
    ports:
      redis: 6379
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# E2 Termination - Handles E2AP protocol with SCTP and ASN.1 support
e2term:
  enabled: true
  image:
    registry: nexus3.o-ran-sc.org:10002
    name: o-ran-sc/ric-plt-e2
    tag: 4.4.6
  service:
    type: NodePort
    ports:
      sctp: 36422
      rmr_data: 4561
      rmr_route: 4560
      prometheus: 8088
  # SCTP configuration for E2 nodes
  sctp:
    nodePort: 32222
  # E2AP configuration
  e2ap:
    version: "v2.0"
    encoding: "PER"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

# E2 Manager - Manages E2 node lifecycle
e2mgr:
  enabled: true
  image:
    registry: nexus3.o-ran-sc.org:10002
    name: o-ran-sc/ric-plt-e2mgr
    tag: 5.4.15
  service:
    type: ClusterIP
    ports:
      http: 3800
      rmr_data: 4561
      rmr_route: 4560
  # E2 Setup configuration
  e2setup:
    timeout: 30s
    retries: 3
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Subscription Manager - Orchestrates E2 subscriptions
submgr:
  enabled: true
  image:
    registry: nexus3.o-ran-sc.org:10002
    name: o-ran-sc/ric-plt-submgr
    tag: 1.8.3
  service:
    type: ClusterIP
    ports:
      http: 8088
      rmr_data: 4561
      rmr_route: 4560
  # Subscription configuration
  subscription:
    timeout: 30s
    retries: 3
    maxConcurrent: 1000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Routing Manager - Manages RMR message routing
rtmgr:
  enabled: true
  image:
    registry: nexus3.o-ran-sc.org:10002
    name: o-ran-sc/ric-plt-rtmgr
    tag: 0.8.3
  service:
    type: ClusterIP
    ports:
      http: 3800
      rmr_data: 4561
      rmr_route: 4560
  # Routing configuration
  routing:
    updateInterval: 10s
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Application Manager - Manages xApp lifecycle
appmgr:
  enabled: true
  image:
    registry: nexus3.o-ran-sc.org:10002
    name: o-ran-sc/ric-plt-appmgr
    tag: 0.5.4
  service:
    type: ClusterIP
    ports:
      http: 8080
      rmr_data: 4561
      rmr_route: 4560
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Interface Components (Optional but recommended)

# A1 Mediator - Implements A1 interface for policy management
a1mediator:
  enabled: true
  image:
    registry: nexus3.o-ran-sc.org:10002
    name: o-ran-sc/ric-plt-a1
    tag: 2.7.1
  service:
    type: ClusterIP
    ports:
      http: 10000
      rmr_data: 4561
      rmr_route: 4560
  # A1 API configuration
  a1:
    version: "v2.1.0"
    auth:
      enabled: true
      jwt:
        algorithm: "RS256"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# O1 Mediator - Implements O1 interface for management plane
o1mediator:
  enabled: true
  image:
    registry: nexus3.o-ran-sc.org:10002
    name: o-ran-sc/ric-plt-o1
    tag: 1.0.0
  service:
    type: ClusterIP
    ports:
      netconf_ssh: 830
      netconf_tls: 6513
      http: 8080
  # NETCONF configuration
  netconf:
    version: "1.1"
    capabilities:
      - "urn:ietf:params:netconf:base:1.1"
      - "urn:ietf:params:netconf:capability:startup:1.0"
      - "urn:ietf:params:netconf:capability:candidate:1.0"
      - "urn:ietf:params:netconf:capability:validate:1.1"
  # YANG models
  yang:
    models:
      - "o-ran-sc-ric-gnb-status-v1.0.0"
      - "o-ran-sc-ric-xapp-desc-v1.0.0"
      - "o-ran-sc-ric-alarm-v1.0.0"
      - "o-ran-sc-ric-kpi-v1.0.0"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Security Configuration
security:
  tls:
    enabled: true
    # Certificate management
    certificates:
      ca:
        secret: oran-sc-ca-cert
      server:
        secret: oran-sc-server-cert
      client:
        secret: oran-sc-client-cert
  
  # RBAC Configuration
  rbac:
    enabled: true
    roles:
      - name: admin
        permissions: ["*"]
      - name: operator
        permissions: ["read", "subscribe"]
      - name: viewer
        permissions: ["read"]

# Networking Configuration
networking:
  # Service mesh configuration
  serviceMesh:
    enabled: false
    type: istio
  
  # Network policies
  networkPolicies:
    enabled: true
    defaultDeny: true
    
  # Ingress configuration
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts: []
    tls: []

# Storage Configuration
storage:
  # Persistent volumes for stateful components
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    
  # Backup configuration
  backup:
    enabled: false
    schedule: "0 2 * * *"
    retention: 7

# Monitoring and Observability
monitoring:
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 8080
    path: /metrics
    
  # Health checks
  healthCheck:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    
  # Logging configuration
  logging:
    level: INFO
    format: json
    correlationId: true

# Development and Testing
development:
  # Enable debug mode
  debug: false
  
  # Mock services for testing
  mockServices:
    enabled: false
    e2nodes: 3
    
  # Resource limits for development
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi