{{- if .Values.observability.nodeExporter.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
    component: node-exporter
spec:
  selector:
    matchLabels:
      {{- include "oran-sc-platform.selectorLabels" . | nindent 6 }}
      component: node-exporter
  template:
    metadata:
      labels:
        {{- include "oran-sc-platform.selectorLabels" . | nindent 8 }}
        component: node-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      hostNetwork: true
      hostPID: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: node-exporter
          image: "{{ .Values.observability.nodeExporter.image.registry }}/{{ .Values.observability.nodeExporter.image.name }}:{{ .Values.observability.nodeExporter.image.tag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
            - --web.listen-address=0.0.0.0:9100
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.observability.nodeExporter.resources | nindent 12 }}
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              mountPropagation: HostToContainer
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /

---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
    component: node-exporter
spec:
  type: {{ .Values.observability.nodeExporter.service.type }}
  ports:
    - port: {{ .Values.observability.nodeExporter.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "oran-sc-platform.selectorLabels" . | nindent 4 }}
    component: node-exporter
{{- end }}