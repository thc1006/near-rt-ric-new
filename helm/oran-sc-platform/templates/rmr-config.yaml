apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oran-sc-platform.fullname" . }}-rmr-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
data:
  # RMR Routing Table Configuration
  rtmgr-config.json: |
    {
      "version": "1.0",
      "routing_table": {
        "message_types": {
          "12001": {
            "name": "E2_SETUP_REQUEST",
            "destinations": ["e2mgr"]
          },
          "12002": {
            "name": "E2_SETUP_RESPONSE",
            "destinations": ["e2term"]
          },
          "12003": {
            "name": "E2_SETUP_FAILURE",
            "destinations": ["e2term"]
          },
          "12010": {
            "name": "RIC_SUB_REQ",
            "destinations": ["submgr"]
          },
          "12011": {
            "name": "RIC_SUB_RESP",
            "destinations": ["submgr"]
          },
          "12012": {
            "name": "RIC_SUB_FAILURE",
            "destinations": ["submgr"]
          },
          "12020": {
            "name": "RIC_INDICATION",
            "destinations": ["submgr"]
          },
          "12021": {
            "name": "RIC_CONTROL_REQ",
            "destinations": ["e2term"]
          },
          "12022": {
            "name": "RIC_CONTROL_ACK",
            "destinations": ["submgr"]
          },
          "12023": {
            "name": "RIC_CONTROL_FAILURE",
            "destinations": ["submgr"]
          },
          "20010": {
            "name": "A1_POLICY_REQ",
            "destinations": ["a1mediator"]
          },
          "20011": {
            "name": "A1_POLICY_RESP",
            "destinations": ["a1mediator"]
          },
          "30010": {
            "name": "O1_CONFIG_REQ",
            "destinations": ["o1mediator"]
          },
          "30011": {
            "name": "O1_CONFIG_RESP",
            "destinations": ["o1mediator"]
          }
        },
        "endpoints": [
          {{- if .Values.e2term.enabled }}
          {
            "name": "e2term",
            "host": "{{ include "oran-sc-platform.fullname" . }}-e2term.{{ .Values.global.namespace }}.svc.cluster.local",
            "port": {{ .Values.global.rmr.data_port }},
            "policies": ["round_robin"]
          },
          {{- end }}
          {{- if .Values.e2mgr.enabled }}
          {
            "name": "e2mgr",
            "host": "{{ include "oran-sc-platform.fullname" . }}-e2mgr.{{ .Values.global.namespace }}.svc.cluster.local",
            "port": {{ .Values.global.rmr.data_port }},
            "policies": ["round_robin"]
          },
          {{- end }}
          {{- if .Values.submgr.enabled }}
          {
            "name": "submgr",
            "host": "{{ include "oran-sc-platform.fullname" . }}-submgr.{{ .Values.global.namespace }}.svc.cluster.local",
            "port": {{ .Values.global.rmr.data_port }},
            "policies": ["round_robin"]
          },
          {{- end }}
          {{- if .Values.a1mediator.enabled }}
          {
            "name": "a1mediator",
            "host": "{{ include "oran-sc-platform.fullname" . }}-a1mediator.{{ .Values.global.namespace }}.svc.cluster.local",
            "port": {{ .Values.global.rmr.data_port }},
            "policies": ["round_robin"]
          },
          {{- end }}
          {{- if .Values.o1mediator.enabled }}
          {
            "name": "o1mediator",
            "host": "{{ include "oran-sc-platform.fullname" . }}-o1mediator.{{ .Values.global.namespace }}.svc.cluster.local",
            "port": {{ .Values.global.rmr.data_port }},
            "policies": ["round_robin"]
          }
          {{- end }}
        ]
      }
    }
  
  # RMR Environment Configuration
  rmr-env.conf: |
    # RMR Configuration Environment Variables
    export RMR_SEED_RT=/etc/rmr/rtmgr-config.json
    export RMR_RTG_SVC=service-ricplt-rtmgr-http.{{ .Values.global.namespace }}.svc.cluster.local:3800
    export RMR_VCTL_FILE=/tmp/rmr.verbose
    export RMR_LOG_VLEVEL=2
    
    # Component-specific RMR settings
    {{- if .Values.e2term.enabled }}
    # E2 Termination
    export E2TERM_RMR_DATA_PORT={{ .Values.global.rmr.data_port }}
    export E2TERM_RMR_ROUTE_PORT={{ .Values.global.rmr.port }}
    {{- end }}
    
    {{- if .Values.e2mgr.enabled }}
    # E2 Manager
    export E2MGR_RMR_DATA_PORT={{ .Values.global.rmr.data_port }}
    export E2MGR_RMR_ROUTE_PORT={{ .Values.global.rmr.port }}
    {{- end }}
    
    {{- if .Values.submgr.enabled }}
    # Subscription Manager
    export SUBMGR_RMR_DATA_PORT={{ .Values.global.rmr.data_port }}
    export SUBMGR_RMR_ROUTE_PORT={{ .Values.global.rmr.port }}
    {{- end }}
  
  # Service Model Configuration
  service-models.json: |
    {
      "service_models": [
        {
          "name": "E2SM-KPM",
          "oid": "1.3.6.1.4.1.53148.1.2.2.2",
          "version": "v2.0",
          "description": "Key Performance Measurement Service Model",
          "functions": [
            {
              "id": 1,
              "name": "KPM_MONITOR",
              "description": "Performance monitoring function"
            },
            {
              "id": 2,
              "name": "KPM_REPORT",
              "description": "Performance reporting function"
            }
          ]
        },
        {
          "name": "E2SM-RC",
          "oid": "1.3.6.1.4.1.53148.1.1.2.3",
          "version": "v1.0",
          "description": "RAN Control Service Model",
          "functions": [
            {
              "id": 3,
              "name": "RC_CONTROL",
              "description": "RAN control function"
            },
            {
              "id": 4,
              "name": "RC_POLICY",
              "description": "RAN policy function"
            }
          ]
        },
        {
          "name": "E2SM-NI",
          "oid": "1.3.6.1.4.1.53148.1.3.2.1",
          "version": "v1.0",
          "description": "Network Interface Service Model",
          "functions": [
            {
              "id": 5,
              "name": "NI_CONTROL",
              "description": "Network interface control function"
            }
          ]
        }
      ]
    }
  
  # RMR Router Configuration
  router.txt: |
    # RMR Routing Table for O-RAN SC Components
    # Format: message_type,sender_endpoint,target_endpoint,group_id
    
    # E2AP Messages
    12001,*,{{ include "oran-sc-platform.fullname" . }}-e2mgr:{{ .Values.global.rmr.data_port }},0  # E2_SETUP_REQUEST
    12002,*,{{ include "oran-sc-platform.fullname" . }}-e2term:{{ .Values.global.rmr.data_port }},0  # E2_SETUP_RESPONSE
    12003,*,{{ include "oran-sc-platform.fullname" . }}-e2term:{{ .Values.global.rmr.data_port }},0  # E2_SETUP_FAILURE
    12010,*,{{ include "oran-sc-platform.fullname" . }}-submgr:{{ .Values.global.rmr.data_port }},0  # RIC_SUB_REQ
    12011,*,{{ include "oran-sc-platform.fullname" . }}-submgr:{{ .Values.global.rmr.data_port }},0  # RIC_SUB_RESP
    12012,*,{{ include "oran-sc-platform.fullname" . }}-submgr:{{ .Values.global.rmr.data_port }},0  # RIC_SUB_FAILURE
    12020,*,{{ include "oran-sc-platform.fullname" . }}-submgr:{{ .Values.global.rmr.data_port }},0  # RIC_INDICATION
    12021,*,{{ include "oran-sc-platform.fullname" . }}-e2term:{{ .Values.global.rmr.data_port }},0  # RIC_CONTROL_REQ
    12022,*,{{ include "oran-sc-platform.fullname" . }}-submgr:{{ .Values.global.rmr.data_port }},0  # RIC_CONTROL_ACK
    12023,*,{{ include "oran-sc-platform.fullname" . }}-submgr:{{ .Values.global.rmr.data_port }},0  # RIC_CONTROL_FAILURE
    
    # A1 Messages
    20010,*,{{ include "oran-sc-platform.fullname" . }}-a1mediator:{{ .Values.global.rmr.data_port }},0  # A1_POLICY_REQ
    20011,*,{{ include "oran-sc-platform.fullname" . }}-a1mediator:{{ .Values.global.rmr.data_port }},0  # A1_POLICY_RESP
    
    # O1 Messages
    30010,*,{{ include "oran-sc-platform.fullname" . }}-o1mediator:{{ .Values.global.rmr.data_port }},0  # O1_CONFIG_REQ
    30011,*,{{ include "oran-sc-platform.fullname" . }}-o1mediator:{{ .Values.global.rmr.data_port }},0  # O1_CONFIG_RESP
    
    # xApp Messages (dynamic routing through RTMGR)
    60000,*,{{ include "oran-sc-platform.fullname" . }}-rtmgr:{{ .Values.global.rmr.data_port }},0  # XAPP_REGISTER
    60001,*,{{ include "oran-sc-platform.fullname" . }}-rtmgr:{{ .Values.global.rmr.data_port }},0  # XAPP_DEREGISTER

  # Health Check Configuration
  health-check.sh: |
    #!/bin/bash
    # Health check script for O-RAN SC components
    
    set -euo pipefail
    
    COMPONENT=${1:-"unknown"}
    NAMESPACE={{ .Values.global.namespace }}
    
    case $COMPONENT in
        "e2term")
            # Check E2 SCTP port
            nc -z -w5 {{ include "oran-sc-platform.fullname" . }}-e2term.${NAMESPACE}.svc.cluster.local {{ .Values.e2term.service.ports.sctp }}
            # Check RMR connectivity
            nc -z -w5 {{ include "oran-sc-platform.fullname" . }}-e2term.${NAMESPACE}.svc.cluster.local {{ .Values.global.rmr.data_port }}
            ;;
        "e2mgr")
            # Check HTTP API
            curl -f -s http://{{ include "oran-sc-platform.fullname" . }}-e2mgr.${NAMESPACE}.svc.cluster.local:{{ .Values.e2mgr.service.ports.http }}/health || exit 1
            ;;
        "submgr")
            # Check HTTP API
            curl -f -s http://{{ include "oran-sc-platform.fullname" . }}-submgr.${NAMESPACE}.svc.cluster.local:{{ .Values.submgr.service.ports.http }}/health || exit 1
            ;;
        "rtmgr")
            # Check HTTP API
            curl -f -s http://{{ include "oran-sc-platform.fullname" . }}-rtmgr.${NAMESPACE}.svc.cluster.local:{{ .Values.rtmgr.service.ports.http }}/health || exit 1
            ;;
        "a1mediator")
            # Check A1 API
            curl -f -s http://{{ include "oran-sc-platform.fullname" . }}-a1mediator.${NAMESPACE}.svc.cluster.local:{{ .Values.a1mediator.service.ports.http }}/a1-p/healthcheck || exit 1
            ;;
        "o1mediator")
            # Check O1 API
            curl -f -s http://{{ include "oran-sc-platform.fullname" . }}-o1mediator.${NAMESPACE}.svc.cluster.local:{{ .Values.o1mediator.service.ports.http }}/health || exit 1
            ;;
        "dbaas")
            # Check Redis connectivity
            redis-cli -h {{ include "oran-sc-platform.fullname" . }}-dbaas.${NAMESPACE}.svc.cluster.local -p {{ .Values.dbaas.service.ports.redis }} ping | grep -q PONG || exit 1
            ;;
        *)
            echo "Unknown component: $COMPONENT"
            exit 1
            ;;
    esac
    
    echo "Health check passed for $COMPONENT"