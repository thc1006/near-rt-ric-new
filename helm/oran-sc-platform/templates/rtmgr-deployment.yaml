{{- if .Values.rtmgr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oran-sc-platform.fullname" . }}-rtmgr
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
    component: rtmgr
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "oran-sc-platform.selectorLabels" . | nindent 6 }}
      component: rtmgr
  template:
    metadata:
      labels:
        {{- include "oran-sc-platform.selectorLabels" . | nindent 8 }}
        component: rtmgr
    spec:
      containers:
      - name: rtmgr
        image: "{{ .Values.rtmgr.image.registry }}/{{ .Values.rtmgr.image.name }}:{{ .Values.rtmgr.image.tag }}"
        imagePullPolicy: {{ .Values.global.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.rtmgr.service.ports.http }}
          protocol: TCP
        - name: rmr-data
          containerPort: {{ .Values.rtmgr.service.ports.rmr_data }}
          protocol: TCP
        - name: rmr-route
          containerPort: {{ .Values.rtmgr.service.ports.rmr_route }}
          protocol: TCP
        env:
        - name: DBAAS_SERVICE_HOST
          value: "{{ include "oran-sc-platform.fullname" . }}-dbaas"
        - name: DBAAS_SERVICE_PORT
          value: "{{ .Values.dbaas.service.ports.redis }}"
        - name: APPMGR_SERVICE_HOST
          value: "{{ include "oran-sc-platform.fullname" . }}-appmgr"
        - name: APPMGR_SERVICE_PORT
          value: "{{ .Values.appmgr.service.ports.http }}"
        - name: E2MGR_SERVICE_HOST
          value: "{{ include "oran-sc-platform.fullname" . }}-e2mgr"
        - name: E2MGR_SERVICE_PORT
          value: "{{ .Values.e2mgr.service.ports.http }}"
        - name: SUBMGR_SERVICE_HOST
          value: "{{ include "oran-sc-platform.fullname" . }}-submgr"
        - name: SUBMGR_SERVICE_PORT
          value: "{{ .Values.submgr.service.ports.http }}"
        - name: ROUTING_UPDATE_INTERVAL
          value: "{{ .Values.rtmgr.routing.updateInterval }}"
        - name: HTTP_PORT
          value: "{{ .Values.rtmgr.service.ports.http }}"
        - name: RMR_DATA_PORT
          value: "{{ .Values.rtmgr.service.ports.rmr_data }}"
        - name: RMR_ROUTE_PORT
          value: "{{ .Values.rtmgr.service.ports.rmr_route }}"
        resources:
          {{- toYaml .Values.rtmgr.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oran-sc-platform.fullname" . }}-rtmgr
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
    component: rtmgr
spec:
  type: {{ .Values.rtmgr.service.type }}
  ports:
  - port: {{ .Values.rtmgr.service.ports.http }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.rtmgr.service.ports.rmr_data }}
    targetPort: rmr-data
    protocol: TCP
    name: rmr-data
  - port: {{ .Values.rtmgr.service.ports.rmr_route }}
    targetPort: rmr-route
    protocol: TCP
    name: rmr-route
  selector:
    {{- include "oran-sc-platform.selectorLabels" . | nindent 4 }}
    component: rtmgr
{{- end }}