apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oran-sc-platform.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "oran-sc-platform.labels" . | nindent 4 }}
data:
  # RMR Routing Configuration
  rmr-routing.json: |
    {
      "routing_table": [
        {{- include "oran-sc-platform.rmrRouting" . | nindent 8 }}
      ],
      "message_types": {
        "12001": ["e2term"],
        "12002": ["e2mgr"],
        "12010": ["submgr"],
        "12020": ["rtmgr"],
        "20010": ["a1mediator"],
        "30010": ["o1mediator"]
      }
    }
  
  # E2AP Configuration
  e2ap-config.yaml: |
    e2ap:
      version: {{ .Values.e2term.e2ap.version | quote }}
      encoding: {{ .Values.e2term.e2ap.encoding | quote }}
      service_models:
        - name: "E2SM-KPM"
          oid: "1.3.6.1.4.1.53148.1.2.2.2"
          version: "v2.0"
        - name: "E2SM-RC"
          oid: "1.3.6.1.4.1.53148.1.1.2.3"
          version: "v1.0"
        - name: "E2SM-NI"
          oid: "1.3.6.1.4.1.53148.1.3.2.1"
          version: "v1.0"
  
  # A1 Policy Configuration
  a1-config.yaml: |
    a1:
      version: {{ .Values.a1mediator.a1.version | quote }}
      authentication:
        enabled: {{ .Values.a1mediator.a1.auth.enabled }}
        {{- if .Values.a1mediator.a1.auth.enabled }}
        jwt:
          algorithm: {{ .Values.a1mediator.a1.auth.jwt.algorithm | quote }}
          public_key_path: "/etc/ssl/certs/jwt-public.key"
        {{- end }}
      policy_types:
        - id: "20000"
          name: "Traffic Steering Policy"
          schema_path: "/etc/a1/schemas/traffic-steering.json"
        - id: "20001"
          name: "QoS Policy"
          schema_path: "/etc/a1/schemas/qos-policy.json"
  
  # O1 NETCONF Configuration
  o1-config.yaml: |
    netconf:
      version: {{ .Values.o1mediator.netconf.version | quote }}
      capabilities:
        {{- range .Values.o1mediator.netconf.capabilities }}
        - {{ . | quote }}
        {{- end }}
      yang_models:
        {{- range .Values.o1mediator.yang.models }}
        - {{ . | quote }}
        {{- end }}
      ports:
        ssh: {{ .Values.o1mediator.service.ports.netconf_ssh }}
        tls: {{ .Values.o1mediator.service.ports.netconf_tls }}
  
  # Logging Configuration
  logging-config.yaml: |
    logging:
      level: {{ .Values.monitoring.logging.level | quote }}
      format: {{ .Values.monitoring.logging.format | quote }}
      correlation_id: {{ .Values.monitoring.logging.correlationId }}
      outputs:
        - type: "stdout"
        - type: "file"
          path: "/var/log/oran-sc/app.log"
          max_size: "100MB"
          max_files: 5
  
  # Security Configuration
  {{- if .Values.security.tls.enabled }}
  tls-config.yaml: |
    {{- include "oran-sc-platform.tlsConfig" . | nindent 4 }}
  {{- end }}
  
  # Health Check Configuration
  health-config.yaml: |
    health_check:
      enabled: {{ .Values.monitoring.healthCheck.enabled }}
      initial_delay: {{ .Values.monitoring.healthCheck.initialDelaySeconds }}s
      period: {{ .Values.monitoring.healthCheck.periodSeconds }}s
      timeout: {{ .Values.monitoring.healthCheck.timeoutSeconds }}s
      failure_threshold: {{ .Values.monitoring.healthCheck.failureThreshold }}
      endpoints:
        - path: "/health"
          port: 8080
        - path: "/ready"
          port: 8080